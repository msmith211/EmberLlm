name: Release

# Push a tag like v0.1.0-beta.1 or v0.1.0 to publish that version to NuGet and create a GitHub release.
# The tag must point at a commit on main, and CHANGELOG.md must have a "## [<version>]" section.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$GITHUB_REF_NAME' points at a commit that is not on main"
            exit 1
          fi

      # Relative links in the changelog are made absolute, since release notes are shown outside the repo.
      # Targets containing ':' (absolute URLs) and anchors ('#...') are left as they are.
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -E "s#\]\((\./)?([^):\#][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\2)#g" \
            > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section with content"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EmberLlm.slnx

      - name: Build
        run: dotnet build EmberLlm.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --solution EmberLlm.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack EmberLlm.slnx -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o packages

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            packages/
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to NuGet and GitHub
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # NuGet trusted publishing

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Trusted publishing: exchanges this workflow's identity for a short-lived NuGet API key, so no key is stored.
      # Needs a trusted publishing policy on nuget.org for this repo and workflow, and the NUGET_USER secret.
      - name: Log in to NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
          PRERELEASE: ${{ needs.pack.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "EmberLlm $VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}"
